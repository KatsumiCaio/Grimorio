<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Solid Dark Gray Rounded Square Canvas -->
    <linearGradient id="bgPlate" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b1f28"/>
      <stop offset="50%" stop-color="#13161e"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>

    <!-- Ancient Grimoire Charcoal Leather Cover -->
    <linearGradient id="grimoireLeather" x1="56" y1="56" x2="456" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181c25"/>
      <stop offset="40%" stop-color="#12151d"/>
      <stop offset="100%" stop-color="#0a0c11"/>
    </linearGradient>

    <!-- Embossed Grimoire Inlay & Corner Metal -->
    <linearGradient id="cornerMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Vibrant Arcane Cyan & Blue Flame Gradients -->
    <linearGradient id="flameCore" x1="256" y1="360" x2="256" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="30%" stop-color="#0ea5e9"/>
      <stop offset="65%" stop-color="#00e5ff"/>
      <stop offset="85%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>

    <linearGradient id="flameWingLeft" x1="160" y1="320" x2="210" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="flameWingRight" x1="352" y1="320" x2="302" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- D20 Facet Gradients (Bold Flat Shading with Dark Arcane Tones) -->
    <linearGradient id="facetCenter" x1="256" y1="200" x2="256" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15365e"/>
      <stop offset="100%" stop-color="#0a1b32"/>
    </linearGradient>

    <linearGradient id="facetTop" x1="256" y1="158" x2="256" y2="201" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e4d82"/>
      <stop offset="100%" stop-color="#0f2947"/>
    </linearGradient>

    <linearGradient id="facetSideL" x1="168" y1="208" x2="256" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#102a4a"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>

    <linearGradient id="facetSideR" x1="344" y1="208" x2="256" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#122f54"/>
      <stop offset="100%" stop-color="#08182b"/>
    </linearGradient>

    <linearGradient id="facetBottom" x1="256" y1="284" x2="256" y2="354" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#163760"/>
      <stop offset="100%" stop-color="#09182a"/>
    </linearGradient>

    <!-- Radial Arcane Glow Filters -->
    <radialGradient id="arcaneAura" cx="256" cy="256" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#0369a1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="cyanGlowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="sharpGlow"/>
      <feGaussianBlur stdDeviation="12" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="sharpGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= 1. SOLID DARK GRAY ROUNDED SQUARE BACKGROUND ================= -->
  <rect width="512" height="512" rx="112" fill="url(#bgPlate)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#2a3242" stroke-width="2.5" opacity="0.6"/>

  <!-- ================= 2. ANCIENT MAGICAL GRIMOIRE COVER (TOP-DOWN FLAT VIEW) ================= -->
  <!-- Centered Leather Cover Base -->
  <rect x="52" y="52" width="408" height="408" rx="28" fill="url(#grimoireLeather)" stroke="#090c12" stroke-width="5"/>

  <!-- Embossed Outer Stitched Border -->
  <rect x="74" y="74" width="364" height="364" rx="18" fill="none" stroke="#252e3d" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- Inner Embossed Recessed Frame -->
  <rect x="88" y="88" width="336" height="336" rx="14" fill="#0d1017" stroke="#1d2636" stroke-width="2.5"/>

  <!-- Symmetrical Four Corner Metal Brackets (Embossed Game Icon Fittings) -->
  <!-- Top-Left Corner Bracket -->
  <path d="M 88 138 L 88 102 C 88 94 94 88 102 88 L 138 88 L 122 104 L 104 104 L 104 122 Z" fill="url(#cornerMetal)" stroke="#111827" stroke-width="2"/>
  <circle cx="100" cy="100" r="3.5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Top-Right Corner Bracket -->
  <path d="M 424 138 L 424 102 C 424 94 418 88 410 88 L 374 88 L 390 104 L 408 104 L 408 122 Z" fill="url(#cornerMetal)" stroke="#111827" stroke-width="2"/>
  <circle cx="412" cy="100" r="3.5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Bottom-Left Corner Bracket -->
  <path d="M 88 374 L 88 410 C 88 418 94 424 102 424 L 138 424 L 122 408 L 104 408 L 104 390 Z" fill="url(#cornerMetal)" stroke="#111827" stroke-width="2"/>
  <circle cx="100" cy="412" r="3.5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Bottom-Right Corner Bracket -->
  <path d="M 424 374 L 424 410 C 424 418 418 424 410 424 L 374 424 L 390 408 L 408 408 L 408 390 Z" fill="url(#cornerMetal)" stroke="#111827" stroke-width="2"/>
  <circle cx="412" cy="412" r="3.5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Ornate Filigree Corner Accents -->
  <path d="M 124 124 C 136 124 144 132 144 144" stroke="#2e3a4e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 388 124 C 376 124 368 132 368 144" stroke="#2e3a4e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 124 388 C 136 388 144 380 144 368" stroke="#2e3a4e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 388 388 C 376 388 368 380 368 368" stroke="#2e3a4e" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ================= 3. SUBTLE EMBOSSED MYSTICAL RUNES IN A CIRCLE ================= -->
  <!-- Outer Runic Ring Track -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#192231" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="136" fill="#090c12" stroke="#243043" stroke-width="2"/>
  <circle cx="256" cy="256" r="114" fill="none" stroke="#18212e" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- Radial Arcane Glow Aura Casting over Grimoire -->
  <circle cx="256" cy="256" r="140" fill="url(#arcaneAura)"/>

  <!-- 24 Embossed Mystical Runes forming a perfect circle around the die -->
  <g fill="#475569" font-family="monospace, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" dominant-baseline="central" opacity="0.9">
    <!-- North & Surrounding -->
    <text transform="translate(256,125) rotate(0)">ᚠ</text>
    <text transform="translate(289,129) rotate(15)">ᚢ</text>
    <text transform="translate(320,142) rotate(30)">ᚦ</text>
    <text transform="translate(346,163) rotate(45)">ᚨ</text>
    <text transform="translate(367,190) rotate(60)">ᚱ</text>
    <text transform="translate(380,222) rotate(75)">ᚲ</text>

    <!-- East & Surrounding -->
    <text transform="translate(385,256) rotate(90)">ᚷ</text>
    <text transform="translate(380,290) rotate(105)">ᚹ</text>
    <text transform="translate(367,322) rotate(120)">ᚺ</text>
    <text transform="translate(346,349) rotate(135)">ᚾ</text>
    <text transform="translate(320,370) rotate(150)">ᛁ</text>
    <text transform="translate(289,383) rotate(165)">ᛃ</text>

    <!-- South & Surrounding -->
    <text transform="translate(256,387) rotate(180)">ᛇ</text>
    <text transform="translate(223,383) rotate(195)">ᛈ</text>
    <text transform="translate(192,370) rotate(210)">ᛉ</text>
    <text transform="translate(166,349) rotate(225)">ᛊ</text>
    <text transform="translate(145,322) rotate(240)">ᛏ</text>
    <text transform="translate(132,290) rotate(255)">ᛒ</text>

    <!-- West & Surrounding -->
    <text transform="translate(127,256) rotate(270)">ᛖ</text>
    <text transform="translate(132,222) rotate(285)">ᛗ</text>
    <text transform="translate(145,190) rotate(300)">ᛚ</text>
    <text transform="translate(166,163) rotate(315)">ᛜ</text>
    <text transform="translate(192,142) rotate(330)">ᛞ</text>
    <text transform="translate(223,129) rotate(345)">ᛟ</text>
  </g>

  <!-- Cardinal Node Stars on Rune Ring -->
  <circle cx="256" cy="114" r="2.5" fill="#38bdf8" filter="url(#intenseBloom)"/>
  <circle cx="398" cy="256" r="2.5" fill="#38bdf8" filter="url(#intenseBloom)"/>
  <circle cx="256" cy="398" r="2.5" fill="#38bdf8" filter="url(#intenseBloom)"/>
  <circle cx="114" cy="256" r="2.5" fill="#38bdf8" filter="url(#intenseBloom)"/>

  <!-- ================= 4. VIBRANT CYAN & BRIGHT ARCANE BLUE FLAMES ================= -->
  <!-- Back Flame Silhouette & Ethereal Glow -->
  <g filter="url(#cyanGlowSoft)">
    <!-- Primary Top Flame Column -->
    <path d="M 230 220 C 205 170 215 130 240 100 C 248 122 258 132 254 115 C 252 90 270 72 278 68 C 282 92 272 118 288 112 C 304 106 318 84 326 94 C 322 120 310 142 324 150 C 342 160 354 184 346 216 C 338 198 328 204 330 222 C 334 250 316 280 296 295 C 298 270 286 250 270 248 C 248 245 236 268 230 285 C 220 262 212 240 230 220 Z" fill="url(#flameCore)" opacity="0.95"/>

    <!-- Left Fire Tongue wrapping around die -->
    <path d="M 190 280 C 158 250 156 200 182 165 C 180 185 192 196 198 192 C 186 215 194 240 210 255 Z" fill="url(#flameWingLeft)" opacity="0.9"/>

    <!-- Right Fire Tongue wrapping around die -->
    <path d="M 322 280 C 354 250 356 200 330 165 C 332 185 320 196 314 192 C 326 215 318 240 302 255 Z" fill="url(#flameWingRight)" opacity="0.9"/>

    <!-- Bottom Swirling Arcane Fire Tails -->
    <path d="M 218 320 C 235 348 252 358 256 356 C 262 344 250 332 238 324" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 294 320 C 277 348 260 358 256 356 C 250 344 262 332 274 324" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sharp Vector Flame Highlights & Core Licks -->
  <g>
    <!-- Inner White-Cyan Flame Spire -->
    <path d="M 246 160 C 242 135 252 110 258 92 C 262 112 268 120 272 108 C 274 94 286 86 290 84 C 291 102 284 120 295 116 C 304 112 312 98 316 106 C 313 125 304 140 312 148 C 315 132 322 136 320 152 C 316 180 298 202 286 212" fill="#e0f2fe" opacity="0.85"/>

    <!-- Left Rim Flame -->
    <path d="M 188 238 C 172 216 174 186 190 168 C 190 182 198 190 202 188 C 195 204 200 222 210 234 Z" fill="#38bdf8"/>

    <!-- Right Rim Flame -->
    <path d="M 324 238 C 340 216 338 186 322 168 C 322 182 314 190 310 188 C 317 204 312 222 302 234 Z" fill="#38bdf8"/>
  </g>

  <!-- Arcane Embers / Floating Cyan Sparks -->
  <circle cx="192" cy="148" r="3.5" fill="#f0f9ff" filter="url(#intenseBloom)"/>
  <circle cx="320" cy="138" r="3" fill="#f0f9ff" filter="url(#intenseBloom)"/>
  <circle cx="262" cy="74" r="4" fill="#f0f9ff" filter="url(#intenseBloom)"/>
  <circle cx="340" cy="98" r="2.5" fill="#38bdf8" filter="url(#intenseBloom)"/>
  <circle cx="162" cy="204" r="2.5" fill="#00e5ff"/>
  <circle cx="350" cy="204" r="3" fill="#00e5ff"/>
  <circle cx="224" cy="106" r="2" fill="#bae6fd"/>

  <!-- ================= 5. THE BOLD 20-SIDED DIE (D20) IN DEAD CENTER ================= -->
  <!-- Outer D20 Silhouette & Bright Cyan Contour -->
  <g id="d20-isometric">
    <!-- Geometric 20-sided die vertices centered at (256, 256):
         Outer points: (256,158), (344,208), (344,304), (256,354), (168,304), (168,208)
         Central front face triangle: (256,201), (304,284), (208,284) -> centroid exactly (256, 256)!
    -->

    <!-- Deep Midnight Base Plate -->
    <polygon points="256,158 344,208 344,304 256,354 168,304 168,208" fill="#070e1a" stroke="#00e5ff" stroke-width="4.5" stroke-linejoin="round" filter="url(#cyanGlowSoft)"/>

    <!-- Outer Facets with Bold Flat Shading & Clean Sharp Lines -->
    <!-- Top Facet -->
    <polygon points="256,158 256,201 344,208" fill="url(#facetTop)" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>
    <text x="286" y="190" fill="#38bdf8" font-size="14" font-family="sans-serif" font-weight="900" opacity="0.8">14</text>

    <!-- Top-Left Facet -->
    <polygon points="256,158 168,208 256,201" fill="#0c1f36" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>
    <text x="226" y="190" fill="#38bdf8" font-size="14" font-family="sans-serif" font-weight="900" opacity="0.8">2</text>

    <!-- Far Upper-Left Facet -->
    <polygon points="168,208 208,284 256,201" fill="url(#facetSideL)" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
    <text x="206" y="238" fill="#38bdf8" font-size="15" font-family="sans-serif" font-weight="900" opacity="0.85">12</text>

    <!-- Far Lower-Left Facet -->
    <polygon points="168,208 168,304 208,284" fill="#081524" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
    <text x="178" y="266" fill="#0284c7" font-size="13" font-family="sans-serif" font-weight="bold" opacity="0.7">18</text>

    <!-- Bottom-Left Facet -->
    <polygon points="168,304 256,354 208,284" fill="#091829" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
    <text x="208" y="324" fill="#38bdf8" font-size="14" font-family="sans-serif" font-weight="bold" opacity="0.75">4</text>

    <!-- Bottom Center-Under Facet -->
    <polygon points="208,284 256,354 304,284" fill="url(#facetBottom)" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
    <text x="256" y="324" fill="#38bdf8" font-size="18" font-family="sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central" opacity="0.9">8</text>

    <!-- Bottom-Right Facet -->
    <polygon points="304,284 256,354 344,304" fill="#071524" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
    <text x="304" y="324" fill="#38bdf8" font-size="14" font-family="sans-serif" font-weight="bold" opacity="0.75">16</text>

    <!-- Far Lower-Right Facet -->
    <polygon points="344,208 344,304 304,284" fill="#0a1a2e" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
    <text x="334" y="266" fill="#0284c7" font-size="13" font-family="sans-serif" font-weight="bold" opacity="0.7">6</text>

    <!-- Far Upper-Right Facet -->
    <polygon points="256,201 304,284 344,208" fill="url(#facetSideR)" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
    <text x="306" y="238" fill="#38bdf8" font-size="15" font-family="sans-serif" font-weight="900" opacity="0.85">10</text>

    <!-- ================= CENTRAL FRONT FACE TRIANGLE (DEAD CENTER) ================= -->
    <polygon points="256,201 304,284 208,284" fill="url(#facetCenter)" stroke="#00ffff" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Radiant Inner Edge Glow -->
    <line x1="256" y1="201" x2="304" y2="284" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="256" y1="201" x2="208" y2="284" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <line x1="208" y1="284" x2="304" y2="284" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

    <!-- THE BOLD "20" ON FRONT FACE (CENTERED AT X=256, Y=256) -->
    <!-- Bloom Shadow under the number -->
    <text x="256" y="258" fill="#00e5ff" font-size="38" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-1.5" filter="url(#intenseBloom)">20</text>
    <!-- Crisp High-Contrast Core Text -->
    <text x="256" y="258" fill="#f0f9ff" font-size="38" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-1.5">20</text>
  </g>
</svg>
