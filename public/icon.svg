<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgPlate" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2229"/>
      <stop offset="50%" stop-color="#12151b"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <linearGradient id="bookCover" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1e27"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>

    <!-- Metal Brackets -->
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Cyan Arcane Flame Gradient -->
    <linearGradient id="cyanFlame" x1="256" y1="380" x2="256" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#00d2ff"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- D20 Facets Gradients -->
    <linearGradient id="d20FacetCenter" x1="256" y1="200" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#163861"/>
      <stop offset="100%" stop-color="#0b1d36"/>
    </linearGradient>

    <linearGradient id="d20FacetTop" x1="256" y1="160" x2="256" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e4e85"/>
      <stop offset="100%" stop-color="#102b4d"/>
    </linearGradient>

    <linearGradient id="d20FacetSide1" x1="170" y1="200" x2="240" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#122d4f"/>
      <stop offset="100%" stop-color="#081526"/>
    </linearGradient>

    <linearGradient id="d20FacetSide2" x1="340" y1="200" x2="270" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15365e"/>
      <stop offset="100%" stop-color="#0a1a30"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Rounded Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgPlate)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#2a303c" stroke-width="3" opacity="0.6"/>

  <!-- Leather Book Cover Base -->
  <rect x="52" y="52" width="408" height="408" rx="28" fill="url(#bookCover)" stroke="#0e131b" stroke-width="6"/>
  <!-- Book Spine Details on Left -->
  <rect x="48" y="52" width="24" height="408" rx="12" fill="#151922" stroke="#090c12" stroke-width="4"/>
  <line x1="48" y1="130" x2="72" y2="130" stroke="#2a3242" stroke-width="5" stroke-linecap="round"/>
  <line x1="48" y1="256" x2="72" y2="256" stroke="#2a3242" stroke-width="5" stroke-linecap="round"/>
  <line x1="48" y1="382" x2="72" y2="382" stroke="#2a3242" stroke-width="5" stroke-linecap="round"/>

  <!-- Outer Stitched Border -->
  <rect x="84" y="68" width="360" height="376" rx="18" fill="none" stroke="#232b3a" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Inner Ornate Frame -->
  <rect x="96" y="80" width="336" height="352" rx="14" fill="#0f131a" stroke="#2c3649" stroke-width="3"/>

  <!-- Corner Filigree Flourishes -->
  <path d="M 112 140 C 112 112 112 112 140 112 C 160 112 166 126 150 134 C 134 142 142 160 134 150" stroke="#3d4b63" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 416 140 C 416 112 416 112 388 112 C 368 112 362 126 378 134 C 394 142 386 160 394 150" stroke="#3d4b63" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 112 372 C 112 400 112 400 140 400 C 160 400 166 386 150 378 C 134 370 142 352 134 362" stroke="#3d4b63" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 416 372 C 416 400 416 400 388 400 C 368 400 362 386 378 378 C 394 370 386 352 394 362" stroke="#3d4b63" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Runic Circle Bands -->
  <circle cx="264" cy="256" r="148" fill="none" stroke="#1d2636" stroke-width="3"/>
  <circle cx="264" cy="256" r="136" fill="#0b0e14" stroke="#273449" stroke-width="2"/>
  <circle cx="264" cy="256" r="112" fill="none" stroke="#1d2636" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Inscribed Nordic Runes in Circle (ᚠ ᛗ ᚱ ᚾ ᛉ ᛊ ᛞ ᚦ ᚱ ᛗ ᛉ ᚱ ᚾ ᛏ) -->
  <g fill="#475569" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" opacity="0.85">
    <text transform="translate(264,132) rotate(0)">ᚠ</text>
    <text transform="translate(304,138) rotate(22)">ᛗ</text>
    <text transform="translate(340,158) rotate(45)">ᚱ</text>
    <text transform="translate(366,188) rotate(68)">ᚾ</text>
    <text transform="translate(378,226) rotate(90)">ᛉ</text>
    <text transform="translate(374,268) rotate(112)">ᛊ</text>
    <text transform="translate(356,306) rotate(135)">ᛞ</text>
    <text transform="translate(324,336) rotate(158)">ᚦ</text>
    <text transform="translate(284,352) rotate(180)">ᛏ</text>
    <text transform="translate(244,352) rotate(202)">ᛒ</text>
    <text transform="translate(204,336) rotate(225)">ᛖ</text>
    <text transform="translate(172,306) rotate(248)">ᛗ</text>
    <text transform="translate(154,268) rotate(270)">ᛚ</text>
    <text transform="translate(150,226) rotate(292)">ᛜ</text>
    <text transform="translate(162,188) rotate(315)">ᛞ</text>
    <text transform="translate(188,158) rotate(338)">ᛟ</text>
    <text transform="translate(224,138) rotate(355)">ᚪ</text>
  </g>

  <!-- Cyan Arcane Fire Glow & Flames wrapping D20 -->
  <!-- Outer Glow Halo -->
  <circle cx="264" cy="256" r="88" fill="#00d2ff" opacity="0.16" filter="url(#cyanGlow)"/>

  <!-- Stylized Cyan Fire Tongues -->
  <g filter="url(#cyanGlow)">
    <!-- Back flame mass -->
    <path d="M 200 290 C 165 260 160 205 190 175 C 198 190 215 195 210 170 C 205 140 235 110 248 92 C 255 125 240 145 258 135 C 265 105 290 95 295 90 C 298 120 285 145 305 138 C 325 130 338 105 348 115 C 342 145 328 165 345 168 C 365 170 375 195 365 225 C 358 208 346 215 348 232 C 352 265 320 300 295 315 C 310 290 325 245 295 240 C 275 238 270 260 264 275 C 255 255 242 245 230 248 C 205 252 215 285 200 290 Z" fill="url(#cyanFlame)" opacity="0.95"/>

    <!-- Left side flame tongue -->
    <path d="M 172 265 C 150 245 152 210 170 190 C 168 205 180 212 186 210 C 175 228 180 248 192 258 Z" fill="#38bdf8"/>

    <!-- Right side flame tongue -->
    <path d="M 356 265 C 378 245 376 210 358 190 C 360 205 348 212 342 210 C 353 228 348 248 336 258 Z" fill="#38bdf8"/>

    <!-- Bottom anchoring wisps -->
    <path d="M 230 340 C 250 362 264 368 266 366 C 270 355 260 345 250 340" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cyan Spark Embers -->
  <circle cx="198" cy="142" r="3.5" fill="#e0f2fe" filter="url(#intenseGlow)"/>
  <circle cx="336" cy="132" r="3" fill="#e0f2fe" filter="url(#intenseGlow)"/>
  <circle cx="270" cy="80" r="4" fill="#e0f2fe" filter="url(#intenseGlow)"/>
  <circle cx="160" cy="210" r="2.5" fill="#38bdf8"/>
  <circle cx="368" cy="205" r="3" fill="#38bdf8"/>
  <circle cx="295" cy="108" r="2" fill="#bae6fd"/>

  <!-- ==================== THE D20 DIE ==================== -->
  <g id="d20-die">
    <!-- D20 Outer Silhouette Base -->
    <polygon points="264,164 348,212 348,308 264,356 180,308 180,212" fill="#081424" stroke="#00e5ff" stroke-width="4.5" stroke-linejoin="round" filter="url(#cyanGlow)"/>

    <!-- Surrounding Facets -->
    <!-- Top triangular facet -->
    <polygon points="264,164 220,208 308,208" fill="url(#d20FacetTop)" stroke="#0284c7" stroke-width="2"/>
    <text x="264" y="195" fill="#38bdf8" font-size="16" font-family="sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central">18</text>

    <!-- Upper left facet -->
    <polygon points="264,164 180,212 220,208" fill="#0c203b" stroke="#0284c7" stroke-width="2"/>
    <!-- Upper right facet -->
    <polygon points="264,164 348,212 308,208" fill="#0e2442" stroke="#0284c7" stroke-width="2"/>
    <text x="326" y="194" fill="#38bdf8" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">4</text>

    <!-- Middle Left Facet (holds "2") -->
    <polygon points="180,212 220,208 220,304" fill="url(#d20FacetSide1)" stroke="#00d2ff" stroke-width="2"/>
    <text x="202" y="244" fill="#38bdf8" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>

    <!-- Middle Right Facet (holds "14") -->
    <polygon points="348,212 308,208 308,304" fill="url(#d20FacetSide2)" stroke="#00d2ff" stroke-width="2"/>
    <text x="324" y="242" fill="#38bdf8" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">14</text>

    <!-- Far left edge facet -->
    <polygon points="180,212 180,308 220,304" fill="#081729" stroke="#0284c7" stroke-width="2"/>
    <text x="189" y="268" fill="#0284c7" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle" transform="rotate(-30 189 268)">12</text>

    <!-- Far right edge facet -->
    <polygon points="348,212 348,308 308,304" fill="#0a1d33" stroke="#0284c7" stroke-width="2"/>
    <text x="338" y="268" fill="#0284c7" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">9</text>

    <!-- Bottom Center-Left Facet (holds "10") -->
    <polygon points="220,304 264,356 180,308" fill="#0b1e36" stroke="#0284c7" stroke-width="2"/>
    <text x="214" y="326" fill="#38bdf8" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle" transform="rotate(25 214 326)">10</text>

    <!-- Bottom Center Facet (holds "8") -->
    <polygon points="220,304 308,304 264,356" fill="#0e233d" stroke="#00d2ff" stroke-width="2"/>
    <text x="264" y="324" fill="#38bdf8" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle" dominant-baseline="central">8</text>

    <!-- Bottom Center-Right Facet (holds "16") -->
    <polygon points="308,304 264,356 348,308" fill="#08172b" stroke="#0284c7" stroke-width="2"/>
    <text x="314" y="326" fill="#38bdf8" font-size="15" font-family="sans-serif" font-weight="bold" text-anchor="middle" transform="rotate(-25 314 326)">16</text>

    <!-- CENTRAL TRIANGULAR FACET - INSCRIBED "20" -->
    <polygon points="264,208 308,304 220,304" fill="url(#d20FacetCenter)" stroke="#00e5ff" stroke-width="3"/>

    <!-- Glowing Edges Inner Lines -->
    <line x1="264" y1="208" x2="308" y2="304" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="264" y1="208" x2="220" y2="304" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="220" y1="304" x2="308" y2="304" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- The Radiant "20" Inscription -->
    <text x="264" y="260" fill="#e0f2fe" font-size="34" font-family="sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-1" filter="url(#intenseGlow)">20</text>
    <text x="264" y="260" fill="#38bdf8" font-size="34" font-family="sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="central" letter-spacing="-1">20</text>
  </g>

  <!-- Metal Corner Brackets (Steel / Slate with Rivets) -->
  <!-- Top-Right Metal Bracket -->
  <path d="M 390 52 L 444 52 C 454 52 460 58 460 68 L 460 122 L 430 92 L 416 106 L 416 88 L 398 88 L 412 74 Z" fill="url(#metalGrad)" stroke="#111827" stroke-width="3"/>
  <circle cx="434" cy="78" r="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- Bottom-Right Metal Bracket -->
  <path d="M 460 390 L 460 444 C 460 454 454 460 444 460 L 390 460 L 412 438 L 398 424 L 416 424 L 416 406 L 430 420 Z" fill="url(#metalGrad)" stroke="#111827" stroke-width="3"/>
  <circle cx="434" cy="434" r="4" fill="#0f172a" stroke="#475569" stroke-width="2"/>
</svg>
