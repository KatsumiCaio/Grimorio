    <script>
      // Suppress benign Vite WebSocket / HMR disconnection rejections in sandboxed iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = event?.reason?.message || event?.reason || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect to websocket'))) {
          event.preventDefault();
        }
      });
    </script>
